<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Шахматный Клуб — Зал, Игроки и Чат</title>
    <meta name="google-site-verification" content="tA8bWlQXzDRsVSZwC3Nhmq_JPD1gaam2M2IkcDWvNRg" />
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- jQuery, ChessboardJS и Chess.js -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #222;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .auth-box, .lobby-box, .profile-box {
            background: #333;
            padding: 25px;
            border-radius: 8px;
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, button, select {
            padding: 10px;
            border-radius: 4px;
            border: none;
            font-size: 14px;
        }
        button {
            background: #4CAF50;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        #status {
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
        #board-container {
            display: none;
            text-align: center;
        }
        #myBoard {
            width: 400px;
            margin: 10px auto;
        }
        .highlight {
            background-color: rgba(76, 175, 80, 0.5) !important;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        .logout-btn {
            background: #7f8c8d;
            font-size: 12px;
            padding: 6px 12px;
        }
        .profile-btn {
            background: #f39c12;
            font-size: 12px;
            padding: 6px 12px;
        }
        .challenge-item, .player-item {
            background: #444;
            padding: 8px 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            font-size: 13px;
        }
        .challenge-item button, .player-item button {
            background: #2196F3;
            padding: 4px 8px;
            font-size: 11px;
        }
        /* Табы (Вкладки) */
        .tab-buttons {
            display: flex;
            gap: 5px;
            border-bottom: 2px solid #444;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        .tab-btn {
            flex: 1;
            background: #444;
            color: #ccc;
            border: none;
            padding: 8px;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            font-size: 13px;
        }
        .tab-btn.active {
            background: #2196F3;
            color: white;
            font-weight: bold;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        /* Часы */
        .timer-container {
            display: flex;
            justify-content: space-around;
            background: #333;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .timer-box {
            font-size: 20px;
            font-weight: bold;
            padding: 6px 15px;
            border-radius: 4px;
            background: #444;
        }
        .timer-active {
            background: #e74c3c !important;
            color: white;
        }
        /* Значки */
        .creator-badge {
            background: linear-gradient(45deg, #f1c40f, #e67e22);
            color: #111;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 10px;
            display: inline-block;
            box-shadow: 0 0 6px rgba(241, 196, 15, 0.6);
        }
        .user-badge {
            background: #34495e;
            color: #ecf0f1;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 10px;
            display: inline-block;
        }
        .tc-badge {
            background: #2980b9;
            color: white;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 10px;
            margin-left: 5px;
        }
        .online-indicator {
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .offline-indicator {
            width: 8px;
            height: 8px;
            background: #7f8c8d;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        /* Чат */
        .chat-container {
            background: #2a2a2a;
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
        }
        .chat-messages {
            height: 110px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
            margin-bottom: 8px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        .chat-msg {
            background: #383838;
            padding: 5px 8px;
            border-radius: 4px;
            word-wrap: break-word;
        }
        .chat-input-box {
            display: flex;
            gap: 5px;
        }
        .chat-input-box input {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }
        .chat-input-box button {
            padding: 8px 12px;
            font-size: 12px;
            background: #27ae60;
        }
        .section-title {
            font-size: 12px;
            font-weight: bold;
            margin: 10px 0 4px 0;
            color: #aaa;
            text-transform: uppercase;
            border-bottom: 1px solid #444;
            padding-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- Авторизация -->
    <div class="auth-box" id="authBox">
        <h2>Шахматный Клуб</h2>
        <input type="text" id="username" placeholder="Email или никнейм">
        <input type="password" id="password" placeholder="Пароль">
        <button id="loginBtn">Войти</button>
        <button id="registerBtn" style="background: #2196F3;">Регистрация</button>
        <div id="status"></div>
    </div>

    <!-- Лобби / Игровой зал -->
    <div class="lobby-box" id="lobbyBox" style="display: none;">
        <div class="top-bar">
            <span id="welcomeUser">Игрок</span>
            <div>
                <button class="profile-btn" id="profileBtn">Профиль</button>
                <button class="logout-btn" id="logoutBtn">Выйти</button>
            </div>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('players')">Игроки</button>
            <button class="tab-btn" onclick="switchTab('challenges')">Вызовы</button>
        </div>

        <div id="playersTab" class="tab-content active">
            <div class="section-title">Онлайн игроки</div>
            <div id="playersList"></div>
        </div>

        <div id="challengesTab" class="tab-content">
            <div class="section-title">Входящие вызовы</div>
            <div id="challengesList"></div>
        </div>

        <!-- Чат с сохранением -->
        <div class="chat-container">
            <div class="section-title" style="margin-top:0;">Общий чат клуба</div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-box">
                <input type="text" id="chatInput" placeholder="Написать сообщение...">
                <button id="chatSendBtn">Отправить</button>
            </div>
        </div>
    </div>

    <!-- Профиль -->
    <div class="profile-box" id="profileBox" style="display: none;">
        <h2>Личный кабинет</h2>
        <div id="profileInfo"></div>
        <button id="backToLobbyBtn" style="background: #7f8c8d; margin-top: 10px;">Назад в лобби</button>
    </div>

    <!-- Шахматная доска -->
    <div id="board-container">
        <h3 id="gameStatus">Игра идет</h3>
        <div class="timer-container">
            <div class="timer-box" id="whiteTimer">05:00</div>
            <div class="timer-box" id="blackTimer">05:00</div>
        </div>
        <div id="myBoard"></div>
        <button id="resignBtn" style="background: #e74c3c; margin-top: 10px;">Сдаться</button>
    </div>

    <script>
        // Инициализация Supabase (ваши данные подключения)
        const SUPABASE_URL = 'https://ваш-проект.supabase.co'; 
        const SUPABASE_ANON_KEY = 'ваш-ключ';
        
        let supabaseClient = null;
        try {
            if (typeof supabase !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error('Supabase init error:', e);
        }

        // Функция переключения вкладок
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tabName === 'players') {
                document.querySelector('.tab-buttons button:nth-child(1)').classList.add('active');
                document.getElementById('playersTab').classList.add('active');
            } else {
                document.querySelector('.tab-buttons button:nth-child(2)').classList.add('active');
                document.getElementById('challengesTab').classList.add('active');
            }
        }

        // Обработка входа и регистрации
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const statusDiv = document.getElementById('status');

            if (!user || !pass) {
                statusDiv.style.color = '#e74c3c';
                statusDiv.textContent = 'Заполните все поля!';
                return;
            }

            if (supabaseClient) {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email: user, password: pass });
                if (error) {
                    statusDiv.style.color = '#e74c3c';
                    statusDiv.textContent = 'Ошибка входа: ' + error.message;
                } else {
                    statusDiv.style.color = '#2ecc71';
                    statusDiv.textContent = 'Успешный вход!';
                    document.getElementById('authBox').style.display = 'none';
                    document.getElementById('lobbyBox').style.display = 'flex';
                    document.getElementById('welcomeUser').textContent = data.user.email;
                }
            } else {
                // Демо-режим, если бэкенд не подключен
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('lobbyBox').style.display = 'flex';
                document.getElementById('welcomeUser').textContent = user;
            }
        });

        document.getElementById('registerBtn').addEventListener('click', async () => {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const statusDiv = document.getElementById('status');

            if (!user || !pass) {
                statusDiv.style.color = '#e74c3c';
                statusDiv.textContent = 'Заполните все поля!';
                return;
            }

            if (supabaseClient) {
                const { data, error } = await supabaseClient.auth.signUp({ email: user, password: pass });
                if (error) {
                    statusDiv.style.color = '#e74c3c';
                    statusDiv.textContent = 'Ошибка регистрации: ' + error.message;
                } else {
                    statusDiv.style.color = '#2ecc71';
                    statusDiv.textContent = 'Регистрация успешна! Проверьте почту или войдите.';
                }
            } else {
                statusDiv.style.color = '#2ecc71';
                statusDiv.textContent = 'Регистрация выполнена (демо)!';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            if (supabaseClient) {
                await supabaseClient.auth.signOut();
            }
            document.getElementById('lobbyBox').style.display = 'none';
            document.getElementById('authBox').style.display = 'flex';
        });

        // --- Сохранение чата в память браузера (localStorage) ---
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');

        // Загружаем историю при открытии страницы
        window.addEventListener('DOMContentLoaded', () => {
            const savedChat = localStorage.getItem('chess_chat_history');
            if (savedChat) {
                chatMessages.innerHTML = savedChat;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        });

        // Отправка и сохранение сообщения
        function sendChatMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';
            msgDiv.textContent = text;
            
            chatMessages.appendChild(msgDiv);
            chatInput.value = '';
            
            // Прокрутка вниз и сохранение
            chatMessages.scrollTop = chatMessages.scrollHeight;
            localStorage.setItem('chess_chat_history', chatMessages.innerHTML);
        }

        chatSendBtn.addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });
    </script>
</body>
</html>
