<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Шахматный Клуб — Зал, Игроки и Чат</title>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- jQuery, ChessboardJS и Chess.js -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #222; color: white; margin: 0; padding: 20px; }
    .auth-box, .lobby-box, .profile-box { background: #333; padding: 25px; border-radius: 8px; width: 380px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    input, button, select { padding: 10px; border-radius: 4px; border: none; font-size: 14px; }
    button { background: #4CAF50; color: white; font-weight: bold; cursor: pointer; }
    #status { font-size: 13px; margin-top: 10px; text-align: center; }
    #board-container { display: none; text-align: center; }
    #myBoard { width: 400px; margin: 10px auto; }
    .highlight { background-color: rgba(76, 175, 80, 0.5) !important; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .logout-btn { background: #7f8c8d; font-size: 12px; padding: 6px 12px; }
    .profile-btn { background: #f39c12; font-size: 12px; padding: 6px 12px; }
    .challenge-item, .player-item { background: #444; padding: 8px 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; margin-top: 5px; font-size: 13px; }
    .challenge-item button, .player-item button { background: #2196F3; padding: 4px 8px; font-size: 11px; }
    
    /* Табы (Вкладки) */
    .tab-buttons { display: flex; gap: 5px; border-bottom: 2px solid #444; padding-bottom: 5px; margin-bottom: 10px; }
    .tab-btn { flex: 1; background: #444; color: #ccc; border: none; padding: 8px; cursor: pointer; border-radius: 4px 4px 0 0; font-size: 13px; }
    .tab-btn.active { background: #2196F3; color: white; font-weight: bold; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Часы */
    .timer-container { display: flex; justify-content: space-around; background: #333; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    .timer-box { font-size: 20px; font-weight: bold; padding: 6px 15px; border-radius: 4px; background: #444; }
    .timer-active { background: #e74c3c !important; color: white; }

    /* Значки */
    .creator-badge { background: linear-gradient(45deg, #f1c40f, #e67e22); color: #111; font-weight: bold; padding: 2px 5px; border-radius: 4px; font-size: 10px; display: inline-block; box-shadow: 0 0 6px rgba(241, 196, 15, 0.6); }
    .user-badge { background: #34495e; color: #ecf0f1; padding: 2px 5px; border-radius: 4px; font-size: 10px; display: inline-block; }
    .tc-badge { background: #2980b9; color: white; padding: 2px 5px; border-radius: 3px; font-size: 10px; margin-left: 5px; }
    .online-indicator { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; display: inline-block; margin-right: 5px; }
    .offline-indicator { width: 8px; height: 8px; background: #7f8c8d; border-radius: 50%; display: inline-block; margin-right: 5px; }

    /* Чат */
    .chat-container { background: #2a2a2a; border-radius: 6px; padding: 10px; margin-top: 10px; }
    .chat-messages { height: 110px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 12px; margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 5px; }
    .chat-msg { background: #383838; padding: 5px 8px; border-radius: 4px; word-wrap: break-word; }
    .chat-input-box { display: flex; gap: 5px; }
    .chat-input-box input { flex: 1; padding: 8px; font-size: 12px; }
    .chat-input-box button { padding: 8px 12px; font-size: 12px; background: #27ae60; }

    .section-title { font-size: 12px; font-weight: bold; margin: 10px 0 4px 0; color: #aaa; text-transform: uppercase; border-bottom: 1px solid #444; padding-bottom: 2px; }
  </style>
</head>
<body>

  <!-- Авторизация -->
  <div class="auth-box" id="authBox">
    <h2>Шахматный Клуб</h2>
    <input type="email" id="email" placeholder="Ваш Email" />
    <input type="password" id="password" placeholder="Пароль" />
    <button onclick="signUp()">Зарегистрироваться</button>
    <button onclick="signIn()" style="background:#2196F3;">Войти</button>
    <p id="status"></p>
  </div>

  <!-- Главное Лобби -->
  <div class="lobby-box" id="lobbyBox" style="display: none;">
    <div class="top-bar">
      <div>
        <span id="userGreeting" style="font-weight: bold; font-size: 14px;"></span>
        <div id="userBadgeHeader" style="margin-top: 4px;"></div>
      </div>
      <div style="display: flex; gap: 5px;">
        <button class="profile-btn" onclick="showProfile()">Профиль</button>
        <button class="logout-btn" onclick="signOut()">Выйти</button>
      </div>
    </div>

    <!-- Переключатель вкладок -->
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('lobbyTab', this)">🎮 Игра</button>
      <button class="tab-btn" onclick="switchTab('playersTab', this)">👥 Игроки</button>
    </div>
    
    <!-- Вкладка 1: Главная / Игра -->
    <div id="lobbyTab" class="tab-content active">
      <label style="font-size: 12px; color: #ccc;">Выберите контроль времени:</label>
      <select id="timeControlSelect" style="background: #444; color: white; cursor: pointer; width: 100%; margin: 5px 0;">
        <option value="1+0">1 + 0 (Пуля / Bullet)</option>
        <option value="3+2">3 + 2 (Блиц / Blitz)</option>
        <option value="10+5">10 + 5 (Рапид / Rapid)</option>
        <option value="30+0">30 + 0 (Классика / Classical)</option>
      </select>

      <button onclick="startBotGame()" style="background: #9b59b6; margin-top: 5px; width: 100%;">Тренировка с Ботом</button>
      <button onclick="createChallenge()" style="background: #e67e22; width: 100%; margin-top: 5px;">Создать вызов (Онлайн)</button>
      
      <h3 style="margin: 10px 0 5px 0; font-size: 14px;">Открытые вызовы:</h3>
      <div id="challengeList" style="max-height: 100px; overflow-y: auto;">
        <p style="font-size: 12px; color: #aaa;">Нет активных вызовов...</p>
      </div>
    </div>

    <!-- Вкладка 2: Список игроков -->
    <div id="playersTab" class="tab-content">
      <div class="section-title">🟢 Игроки онлайн (<span id="onlineCount">0</span>)</div>
      <div id="onlinePlayersList" style="max-height: 100px; overflow-y: auto;">
        <!-- Игроки в сети -->
      </div>

      <div class="section-title">👤 Все игроки</div>
      <div id="allPlayersList" style="max-height: 100px; overflow-y: auto;">
        <!-- Список всех игроков -->
      </div>
    </div>

    <!-- Общий чат -->
    <div class="chat-container">
      <h4 style="margin: 0 0 8px 0; font-size: 12px; color: #f1c40f;">💬 Общий Чат</h4>
      <div class="chat-messages" id="chatMessages">
        <div style="font-size: 11px; color: #888;">Добро пожаловать в общий чат!</div>
      </div>
      <div class="chat-input-box">
        <input type="text" id="chatInput" placeholder="Напишите сообщение..." onkeypress="handleChatKeyPress(event)">
        <button onclick="sendChatMessage()">Отправить</button>
      </div>
    </div>
  </div>

  <!-- Окно профиля -->
  <div class="profile-box" id="profileBox" style="display: none;">
    <h2>Профиль Игрока</h2>
    <p><b>Email:</b> <span id="profileEmail"></span></p>
    <p><b>Статус:</b> <span id="profileBadge"></span></p>
    <hr style="border-color: #555; width: 100%;">
    <button onclick="closeProfile()" style="background: #34495e;">← Назад в Лобби</button>
  </div>

  <!-- Блок с шахматной доской -->
  <div id="board-container">
    <div class="top-bar">
      <button class="logout-btn" onclick="leaveGame()">← Вернуться в Зал</button>
      <span id="gameModeTitle" style="font-weight: bold; color: #f1c40f;"></span>
    </div>

    <div class="timer-container">
      <div>
        <div style="font-size: 11px; color: #aaa;">ЧЁРНЫЕ</div>
        <div id="timerBlack" class="timer-box">00:00</div>
      </div>
      <div>
        <div style="font-size: 11px; color: #aaa;">БЕЛЫЕ</div>
        <div id="timerWhite" class="timer-box">00:00</div>
      </div>
    </div>

    <p id="playerColor" style="color: #3498db; font-weight: bold; margin: 5px 0;"></p>
    <p id="gameStatus" style="color: #4CAF50; font-weight: bold; margin: 5px 0;">Ваш ход</p>
    <div id="myBoard"></div>
    <button onclick="resetGame()" style="background: #e74c3c; margin-top: 10px;">Сдаться / Новая игра</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://kxetnpcgftrcnyppwqlt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_63F9VzVBhnlYW9WVf4d59w_-nmYxdFV';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const CREATOR_EMAIL = 'chessmishel@ukr.net';

    let board = null;
    let game = new Chess();
    let myColor = 'w';
    let gameChannel = null;
    let lobbyChannel = null;
    let mode = 'bot';
    let currentUser = null;

    let timeWhite = 0;
    let timeBlack = 0;
    let incrementSeconds = 0;
    let timerInterval = null;

    // Кеш для всех заходивших игроков
    let registeredPlayers = new Map();

    const pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

    window.onload = async function() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        showLobby();
      }
    };

    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await _supabase.auth.signUp({ email, password });
      if (error) document.getElementById('status').innerText = 'Ошибка: ' + error.message;
      else document.getElementById('status').innerText = 'Проверьте почту!';
    }

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) document.getElementById('status').innerText = 'Ошибка: ' + error.message;
      else {
        currentUser = data.user;
        showLobby();
      }
    }

    async function signOut() {
      stopTimer();
      if (lobbyChannel) _supabase.removeChannel(lobbyChannel);
      if (gameChannel) _supabase.removeChannel(gameChannel);
      await _supabase.auth.signOut();
      document.getElementById('board-container').style.display = 'none';
      document.getElementById('lobbyBox').style.display = 'none';
      document.getElementById('profileBox').style.display = 'none';
      document.getElementById('authBox').style.display = 'flex';
    }

    function isCreator(email) {
      return email.toLowerCase() === CREATOR_EMAIL.toLowerCase();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function showLobby() {
      document.getElementById('authBox').style.display = 'none';
      document.getElementById('profileBox').style.display = 'none';
      document.getElementById('board-container').style.display = 'none';
      document.getElementById('lobbyBox').style.display = 'flex';
      
      const username = currentUser.email.split('@')[0];
      document.getElementById('userGreeting').innerText = username;

      const badgeContainer = document.getElementById('userBadgeHeader');
      if (isCreator(currentUser.email)) {
        badgeContainer.innerHTML = '<span class="creator-badge">👑 СОЗДАТЕЛЬ</span>';
      } else {
        badgeContainer.innerHTML = '<span class="user-badge">Игрок</span>';
      }

      lobbyChannel = _supabase.channel('lobby-room', {
        config: { presence: { key: currentUser.id } }
      });
      
      lobbyChannel.on('broadcast', { event: 'new-challenge' }, payload => addChallengeToList(payload.payload));
      lobbyChannel.on('broadcast', { event: 'chat-msg' }, payload => appendChatMessage(payload.payload));

      lobbyChannel.on('presence', { event: 'sync' }, () => {
        const state = lobbyChannel.presenceState();
        updatePlayersLists(state);
      });

      lobbyChannel.subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await lobbyChannel.track({
            email: currentUser.email,
            username: username,
            isCreator: isCreator(currentUser.email)
          });
        }
      });
    }

    function updatePlayersLists(presenceState) {
      const onlineContainer = document.getElementById('onlinePlayersList');
      const allContainer = document.getElementById('allPlayersList');
      
      onlineContainer.innerHTML = '';
      allContainer.innerHTML = '';

      let onlineEmails = new Set();
      let onlineCount = 0;

      // 1. Формируем список тех, кто онлайн
      for (let key in presenceState) {
        const userArray = presenceState[key];
        userArray.forEach(user => {
          onlineCount++;
          onlineEmails.add(user.email);
          registeredPlayers.set(user.email, user);

          const item = document.createElement('div');
          item.className = 'player-item';
          const tag = user.isCreator ? ' <span class="creator-badge">👑 СОЗДАТЕЛЬ</span>' : '';
          const isSelf = user.email === currentUser.email ? ' (Вы)' : '';

          item.innerHTML = `
            <span><span class="online-indicator"></span><b>${user.username}</b>${tag}${isSelf}</span>
            ${user.email !== currentUser.email ? `<button onclick="createChallenge()">Вызвать</button>` : ''}
          `;
          onlineContainer.appendChild(item);
        });
      }

      document.getElementById('onlineCount').innerText = onlineCount;

      // 2. Отображаем общий список игроков
      registeredPlayers.forEach((user, email) => {
        const item = document.createElement('div');
        item.className = 'player-item';
        const tag = user.isCreator ? ' <span class="creator-badge">👑</span>' : '';
        const isOnline = onlineEmails.has(email);
        const indicator = isOnline ? '<span class="online-indicator"></span>' : '<span class="offline-indicator"></span>';
        const statusLabel = isOnline ? ' <small style="color:#2ecc71;">(онлайн)</small>' : ' <small style="color:#888;">(офлайн)</small>';

        item.innerHTML = `
          <span>${indicator}<b>${user.username}</b>${tag}${statusLabel}</span>
        `;
        allContainer.appendChild(item);
      });
    }

    function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const msgData = {
        sender: currentUser.email.split('@')[0],
        isCreator: isCreator(currentUser.email),
        text: text
      };

      lobbyChannel.send({ type: 'broadcast', event: 'chat-msg', payload: msgData });
      appendChatMessage(msgData);
      input.value = '';
    }

    function handleChatKeyPress(e) {
      if (e.key === 'Enter') sendChatMessage();
    }

    function appendChatMessage(data) {
      const chatBox = document.getElementById('chatMessages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-msg';

      const tag = data.isCreator ? '<span class="creator-badge">👑</span> ' : '';
      msgDiv.innerHTML = `<b>${tag}${data.sender}:</b> ${escapeHtml(data.text)}`;

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function showProfile() {
      document.getElementById('lobbyBox').style.display = 'none';
      document.getElementById('profileBox').style.display = 'flex';
      
      document.getElementById('profileEmail').innerText = currentUser.email;
      const profileBadge = document.getElementById('profileBadge');
      if (isCreator(currentUser.email)) {
        profileBadge.innerHTML = '<span class="creator-badge">👑 СОЗДАТЕЛЬ САЙТА</span>';
      } else {
        profileBadge.innerHTML = '<span class="user-badge">Участник клуба</span>';
      }
    }

    function closeProfile() {
      document.getElementById('profileBox').style.display = 'none';
      document.getElementById('lobbyBox').style.display = 'flex';
    }

    function setupTimer(tcString) {
      const parts = tcString.split('+');
      const minutes = parseInt(parts[0]);
      incrementSeconds = parseInt(parts[1]);

      timeWhite = minutes * 60;
      timeBlack = minutes * 60;
      updateTimerDisplay();
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updateTimerDisplay() {
      document.getElementById('timerWhite').innerText = formatTime(timeWhite);
      document.getElementById('timerBlack').innerText = formatTime(timeBlack);

      if (game.turn() === 'w') {
        document.getElementById('timerWhite').classList.add('timer-active');
        document.getElementById('timerBlack').classList.remove('timer-active');
      } else {
        document.getElementById('timerBlack').classList.add('timer-active');
        document.getElementById('timerWhite').classList.remove('timer-active');
      }
    }

    function startTimer() {
      stopTimer();
      timerInterval = setInterval(() => {
        if (game.game_over()) { stopTimer(); return; }
        if (game.turn() === 'w') {
          if (timeWhite > 0) timeWhite--;
          else handleTimeOut('b');
        } else {
          if (timeBlack > 0) timeBlack--;
          else handleTimeOut('w');
        }
        updateTimerDisplay();
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
    }

    function handleTimeOut(winnerColor) {
      stopTimer();
      const winnerName = winnerColor === 'w' ? 'Белые' : 'Чёрные';
      document.getElementById('gameStatus').innerText = `Время вышло! ${winnerName} победили.`;
    }

    function createChallenge() {
      const tc = document.getElementById('timeControlSelect').value;
      const roomCode = 'game_' + Math.random().toString(36).substring(2, 9);
      const challengeData = { 
        hostEmail: currentUser.email, 
        roomCode: roomCode,
        isCreator: isCreator(currentUser.email),
        timeControl: tc
      };

      lobbyChannel.send({ type: 'broadcast', event: 'new-challenge', payload: challengeData });
      startOnlineGame(roomCode, 'w', tc);
    }

    function addChallengeToList(data) {
      const list = document.getElementById('challengeList');
      if (list.innerHTML.includes('Нет активных вызовов')) list.innerHTML = '';

      const creatorTag = data.isCreator ? ' <span class="creator-badge">👑</span>' : '';
      const item = document.createElement('div');
      item.className = 'challenge-item';
      item.innerHTML = `
        <span><b>${data.hostEmail.split('@')[0]}</b>${creatorTag} <span class="tc-badge">${data.timeControl}</span></span>
        <button onclick="acceptChallenge('${data.roomCode}', '${data.timeControl}')">Принять</button>
      `;
      list.appendChild(item);
    }

    function acceptChallenge(roomCode, tc) {
      startOnlineGame(roomCode, 'b', tc);
    }

    function startBotGame() {
      mode = 'bot';
      myColor = 'w';
      const tc = document.getElementById('timeControlSelect').value;
      setupTimer(tc);

      document.getElementById('lobbyBox').style.display = 'none';
      document.getElementById('board-container').style.display = 'block';
      document.getElementById('gameModeTitle').innerText = `Игра с Ботом (${tc})`;
      document.getElementById('playerColor').innerText = 'Вы играете за: БЕЛЫХ';
      initBoard('white');
      resetGame();
    }

    function startOnlineGame(roomCode, color, tc) {
      mode = 'online';
      myColor = color;
      setupTimer(tc);

      document.getElementById('lobbyBox').style.display = 'none';
      document.getElementById('board-container').style.display = 'block';
      document.getElementById('gameModeTitle').innerText = `Дуэль (${tc})`;
      document.getElementById('playerColor').innerText = 'Вы играете за: ' + (myColor === 'w' ? 'БЕЛЫХ' : 'ЧЁРНЫХ');
      
      initBoard(myColor === 'w' ? 'white' : 'black');
      
      gameChannel = _supabase.channel(roomCode);
      gameChannel.on('broadcast', { event: 'move' }, payload => {
        game.move(payload.payload.move);
        board.position(game.fen());
        if (game.turn() === 'w') timeBlack += incrementSeconds;
        else timeWhite += incrementSeconds;
        updateStatus();
      });
      gameChannel.subscribe();

      resetGame();
    }

    function leaveGame() {
      stopTimer();
      if (gameChannel) _supabase.removeChannel(gameChannel);
      showLobby();
    }

    function removeHighlights() { $('#myBoard .square-55d63').removeClass('highlight'); }
    function highlightSquare(square) { $('#myBoard .square-' + square).addClass('highlight'); }

    function onDragStart(source, piece) {
      if (game.game_over()) return false;
      if (mode === 'bot') {
        if (piece.search(/^b/) !== -1) return false;
      } else {
        if ((game.turn() !== myColor) ||
            (game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1)) return false;
      }
    }

    function onMouseoverSquare(square) {
      if (mode === 'online' && game.turn() !== myColor) return;
      const moves = game.moves({ square: square, verbose: true });
      if (moves.length === 0) return;
      highlightSquare(square);
      for (let i = 0; i < moves.length; i++) highlightSquare(moves[i].to);
    }

    function onMouseoutSquare() { removeHighlights(); }

    function evaluateBoard(boardState) {
      let total = 0;
      for (let i = 0; i < 8; i++) {
        for (let j = 0; j < 8; j++) {
          const piece = boardState[i][j];
          if (piece) total += piece.color === 'b' ? pieceValues[piece.type] : -pieceValues[piece.type];
        }
      }
      return total;
    }

    function makeSmartBotMove() {
      const possibleMoves = game.moves({ verbose: true });
      if (possibleMoves.length === 0) return;

      let bestMove = null;
      let bestValue = -9999;
      for (let i = 0; i < possibleMoves.length; i++) {
        const move = possibleMoves[i];
        game.move(move);
        const boardValue = evaluateBoard(game.board());
        game.undo();
        if (boardValue > bestValue) { bestValue = boardValue; bestMove = move; }
      }
      game.move(bestMove);
      board.position(game.fen());
      timeBlack += incrementSeconds;
      updateStatus();
    }

    function onDrop(source, target) {
      removeHighlights();
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';

      if (game.turn() === 'b') timeWhite += incrementSeconds;
      else timeBlack += incrementSeconds;

      if (mode === 'online' && gameChannel) {
        gameChannel.send({ type: 'broadcast', event: 'move', payload: { move: move } });
      }

      updateStatus();
      if (mode === 'bot' && !game.game_over()) window.setTimeout(makeSmartBotMove, 300);
    }

    function onSnapEnd() { board.position(game.fen()); }

    function updateStatus() {
      if (game.history().length === 1) startTimer();
      let statusText = '';
      if (game.in_checkmate()) { statusText = 'Мат! Игра окончена.'; stopTimer(); }
      else if (game.in_draw()) { statusText = 'Ничья!'; stopTimer(); }
      else {
        if (mode === 'bot') statusText = game.turn() === 'w' ? 'Ваш ход (Белые)' : 'Бот думает...';
        else {
          const turnText = game.turn() === 'w' ? 'Ход Белых' : 'Ход Чёрных';
          statusText = (game.turn() === myColor) ? turnText + ' (Ваш ход!)' : turnText + ' (Соперник думает...)';
        }
        if (game.in_check()) statusText += ' — ШАХ!';
      }
      document.getElementById('gameStatus').innerText = statusText;
      updateTimerDisplay();
    }

    function initBoard(orientation) {
      if (board) board.destroy();
      board = Chessboard('myBoard', {
        draggable: true,
        position: 'start',
        orientation: orientation,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onMouseoutSquare: onMouseoutSquare,
        onMouseoverSquare: onMouseoverSquare,
        onSnapEnd: onSnapEnd
      });
    }

    function resetGame() {
      stopTimer();
      game.reset();
      if (board) board.start();
      const tc = document.getElementById('timeControlSelect').value;
      setupTimer(tc);
      updateStatus();
    }
  </script>
</body>
</html>
