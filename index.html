<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Шахматный Клуб — Зал, Онлайн и Бот</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body { font-family: sans-serif; background: #222; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #333; padding: 25px; border-radius: 8px; width: 440px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        h2 { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin-bottom: 12px; border: none; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .btn-login { background: #4CAF50; color: white; }
        .btn-reg { background: #2196F3; color: white; }
        .btn-logout { background: #f44336; color: white; }
        .btn-back { background: #757575; color: white; }
        .btn-undo { background: #ff9800; color: white; }
        .section { display: none; }
        .chat-box, .players-box { height: 150px; background: #222; border-radius: 4px; padding: 10px; overflow-y: scroll; margin-bottom: 10px; font-size: 14px; text-align: left; }
        .bot-btn { background: #ff9800; color: white; }
        .color-btn { background: #673AB7; color: white; }
        .online-btn { background: #009688; color: white; }

        /* Шахматная доска */
        #chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 340px;
            height: 340px;
            margin: 0 auto 10px auto;
            border: 4px solid #444;
            border-radius: 4px;
            position: relative;
        }
        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            cursor: pointer;
            user-select: none;
            line-height: 1;
            position: relative;
        }
        .light { background: #f0d9b5; }
        .dark { background: #b58863; }
        .white-piece { color: #fff; text-shadow: 0 1px 2px #000, 0 0 2px #000; }
        .black-piece { color: #111; text-shadow: 0 1px 1px rgba(255,255,255,0.4); }
        .square.selected { background: #7b61ff !important; }
        .square.best-move-from { background: #ffeb3b !important; }
        .square.best-move-to { background: #8bc34a !important; }

        #analysis-panel { background: #222; padding: 8px; border-radius: 4px; font-size: 13px; margin-bottom: 8px; color: #a5d6a7; text-align: left; }
        #moves-history { background: #222; height: 60px; border-radius: 4px; padding: 8px; overflow-y: auto; font-size: 13px; text-align: left; margin-bottom: 8px; color: #ddd; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Авторизация -->
    <div class="card section" id="auth-form" style="display: block;">
        <h2>Шахматный Клуб</h2>
        <input type="email" id="email" placeholder="Электронная почта">
        <input type="text" id="username" placeholder="Придумайте ник">
        <input type="password" id="password" placeholder="Пароль">
        <button type="button" class="btn-login" onclick="handleLogin()">Войти</button>
        <button type="button" class="btn-reg" onclick="handleRegister()">Регистрация</button>
        <div id="message" style="font-size: 14px; margin-top: 10px;"></div>
    </div>

    <!-- Главный зал -->
    <div class="card section" id="game-hall">
        <h2>Шахматный Зал</h2>
        <p id="welcome-user" style="margin-bottom: 15px;"></p>
        <button type="button" class="btn-login" onclick="openGameSection()">Игра с ботом</button>
        <button type="button" class="online-btn" onclick="openOnlineLobby()">Играть онлайн (Лобби)</button>
        <button type="button" class="bot-btn" onclick="openAnalysisMode()">Анализ партии (Stockfish)</button>
        <button type="button" class="btn-reg" onclick="openChat()">Общий чат</button>
        <button type="button" class="btn-reg" onclick="openPlayers()">Игроки</button>
        <button type="button" class="btn-reg" onclick="openMyProfile()">Профиль</button>
        <button type="button" class="btn-logout" onclick="handleLogout()">Выйти</button>
    </div>

    <!-- Игровое поле / Анализ -->
    <div class="card section" id="game-section">
        <h2 id="section-title">Анализ партии</h2>
        
        <div id="step-color">
            <p style="font-size: 14px; margin-bottom: 10px; color: #FFD700;">За какой цвет хотите играть?</p>
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <button type="button" class="color-btn" onclick="chooseColor('white')">Белые</button>
                <button type="button" class="color-btn" onclick="chooseColor('black')">Чёрные</button>
                <button type="button" class="color-btn" onclick="chooseColor('random')">Случайный</button>
            </div>
        </div>

        <div id="step-difficulty" style="display: none;">
            <p id="difficulty-status" style="font-size: 14px; margin-bottom: 10px; color: #FFD700;">Выберите сложность бота:</p>
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <button type="button" class="bot-btn" onclick="startBotGame('easy')">1. Лёгкий</button>
                <button type="button" class="bot-btn" onclick="startBotGame('medium')">2. Средний</button>
                <button type="button" class="bot-btn" onclick="startBotGame('hard')">3. Сложный</button>
            </div>
        </div>

        <div id="chessboard" style="display: none;"></div>
        <div id="analysis-panel" style="display: none;">🤖 Стокфиш анализирует...</div>
        <div id="moves-history" style="display: none;"><b>Ходы:</b> <span id="moves-text">нет</span></div>
        
        <button type="button" id="undo-btn" class="btn-undo" style="display: none;" onclick="undoMove()">↩️ Вернуть ход</button>
        <button type="button" class="btn-back" onclick="resetGameMenu()">Назад в зал</button>
    </div>

    <!-- Онлайн лобби -->
    <div class="card section" id="online-section">
        <h2>Онлайн Лобби</h2>
        <button type="button" class="online-btn" onclick="createOnlineGame()">Создать новую игру</button>
        <div class="players-box" id="online-games-list" style="margin-top: 15px;"><div>Поиск игр...</div></div>
        <button type="button" class="btn-back" onclick="showSection('game-hall')">Назад в зал</button>
    </div>

    <!-- Чат -->
    <div class="card section" id="chat-section">
        <h2>Общий Чат</h2>
        <div class="chat-box" id="chat-messages"><div>Загрузка...</div></div>
        <input type="text" id="chat-input" placeholder="Введите сообщение...">
        <button type="button" class="btn-login" id="send-btn">Отправить</button>
        <button type="button" class="btn-back" onclick="showSection('game-hall')">Назад в зал</button>
    </div>

    <!-- Игроки -->
    <div class="card section" id="players-section">
        <h2>Игроки клуба</h2>
        <div class="players-box" id="players-list"><div>Загрузка...</div></div>
        <button type="button" class="btn-back" onclick="showSection('game-hall')">Назад в зал</button>
    </div>

    <!-- Профиль -->
    <div class="card section" id="profile-section">
        <h2>Профиль игрока</h2>
        <p id="profile-info"></p>
        <button type="button" class="btn-back" onclick="showSection('game-hall')">Назад в зал</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://kxetnpcgftrcnyppwqlt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4ZXRucGNnZnRyY255cHB3cWx0Iiwicm9sZSI6ImFub24iOiJpYXQiOjE3ODc2Mjc4NzIsImV4cCI6MjEwMzIwMzg3Mn0.sCn_jUrDLWpyz4qRlkr6EKklvrx1UKdCJUkutWcZ8Po';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let game = new Chess();
        let currentBotDifficulty = 'easy';
        let playerColor = 'white';
        let selectedSquare = null;
        let bestMoveFrom = null;
        let bestMoveTo = null;
        let isOnlineGame = false;
        let isAnalysisMode = false;
        let activeRoomId = null;
        let onlineChannel = null;

        const pieceSymbols = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        async function handleRegister() {
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');
            if (!email || !username || !password) { msg.textContent = 'Заполните все поля!'; return; }
            const { error } = await supabaseClient.auth.signUp({ email, password, options: { data: { username } } });
            if (error) msg.textContent = 'Ошибка: ' + error.message;
            else {
                await supabaseClient.auth.signInWithPassword({ email, password });
                checkUserSession();
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) document.getElementById('message').textContent = 'Неверный логин или пароль!';
            else checkUserSession();
        }

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                showSection('game-hall');
                document.getElementById('welcome-user').textContent = 'Игрок: ' + (currentUser.user_metadata?.username || currentUser.email);
            }
        }

        function openMyProfile() {
            if (currentUser) {
                let name = currentUser.user_metadata?.username || currentUser.email;
                showSection('profile-section');
                document.getElementById('profile-info').innerHTML = `<b>Ник:</b> ${name}<br><b>Статус:</b> В сети`;
            }
        }

        async function handleLogout() {
            if (onlineChannel) supabaseClient.removeChannel(onlineChannel);
            await supabaseClient.auth.signOut();
            location.reload();
        }

        function showSection(id) {
            document.querySelectorAll('.section').forEach(sec => sec.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        function openChat() { showSection('chat-section'); loadMessages(); }
        function openPlayers() { showSection('players-section'); loadPlayers(); }
        function openOnlineLobby() { showSection('online-section'); loadOnlineRooms(); }

        function openAnalysisMode() {
            isOnlineGame = false;
            isAnalysisMode = true;
            game.reset();
            selectedSquare = null;
            bestMoveFrom = null;
            bestMoveTo = null;
            playerColor = 'white';

            showSection('game-section');
            document.getElementById('section-title').textContent = 'Анализ партии (Stockfish)';
            document.getElementById('step-color').style.display = 'none';
            document.getElementById('step-difficulty').style.display = 'none';
            document.getElementById('chessboard').style.display = 'grid';
            document.getElementById('analysis-panel').style.display = 'block';
            document.getElementById('moves-history').style.display = 'block';
            document.getElementById('undo-btn').style.display = 'block';

            renderBoard();
            updateHistoryDisplay();
            requestStockfishCloud();
        }

        function openGameSection() {
            isOnlineGame = false;
            isAnalysisMode = false;
            showSection('game-section');
            document.getElementById('section-title').textContent = 'Игра против Бот-Клуба';
            document.getElementById('step-color').style.display = 'block';
            document.getElementById('step-difficulty').style.display = 'none';
            document.getElementById('chessboard').style.display = 'none';
            document.getElementById('analysis-panel').style.display = 'none';
            document.getElementById('moves-history').style.display = 'none';
            document.getElementById('undo-btn').style.display = 'none';
        }

        function resetGameMenu() {
            if (onlineChannel) supabaseClient.removeChannel(onlineChannel);
            isOnlineGame = false;
            isAnalysisMode = false;
            showSection('game-hall');
        }

        function chooseColor(color) {
            playerColor = (color === 'random') ? (Math.random() < 0.5 ? 'white' : 'black') : color;
            document.getElementById('step-color').style.display = 'none';
            document.getElementById('step-difficulty').style.display = 'block';
        }

        function startBotGame(difficulty) {
            currentBotDifficulty = difficulty;
            game.reset();
            selectedSquare = null;
            bestMoveFrom = null;
            bestMoveTo = null;

            document.getElementById('step-difficulty').style.display = 'none';
            document.getElementById('chessboard').style.display = 'grid';
            document.getElementById('analysis-panel').style.display = 'none'; // Стокфиш скрыт в игре с ботом
            document.getElementById('moves-history').style.display = 'block';
            document.getElementById('undo-btn').style.display = 'block';

            renderBoard();
            updateHistoryDisplay();
            if (playerColor === 'black') window.setTimeout(makeBotMove, 200);
        }

        // --- ТОЧНЫЙ АНАЛИЗ СТОКФИШ (ТОЛЬКО ДЛЯ РЕЖИМА АНАЛИЗА) ---
        async function requestStockfishCloud() {
            if (!isAnalysisMode) return; // Защита: не запрашиваем Стокфиш вне режима анализа
            const panel = document.getElementById('analysis-panel');
            panel.textContent = '🤖 Стокфиш анализирует позицию...';
            bestMoveFrom = null;
            bestMoveTo = null;
            renderBoard();

            try {
                let fen = encodeURIComponent(game.fen());
                let res = await fetch(`https://lichess.org/api/cloud-eval?fen=${fen}`);
                let data = await res.json();

                if (data && data.pvs && data.pvs.length > 0) {
                    let cp = data.eval;
                    let scoreText = '0.00';

                    if (cp !== undefined && cp !== null) {
                        let evalNum = (game.turn() === 'b' ? -cp : cp) / 100;
                        scoreText = (evalNum > 0 ? '+' : '') + evalNum.toFixed(2);
                    } else if (data.mate !== undefined && data.mate !== null) {
                        scoreText = `Мат в ${data.mate}`;
                    }

                    let bestMoveUCI = data.pvs[0].moves.split(' ')[0]; 
                    if (bestMoveUCI && bestMoveUCI.length >= 4) {
                        bestMoveFrom = bestMoveUCI.substring(0, 2);
                        bestMoveTo = bestMoveUCI.substring(2, 4);
                    }

                    panel.textContent = `🤖 Стокфиш: Оценка = ${scoreText} | Лучший ход: ${bestMoveUCI}`;
                    renderBoard();
                } else {
                    panel.textContent = '🤖 Стокфиш: Оценка = 0.00 (дебютная позиция) | Лучший ход: e2e4';
                    bestMoveFrom = 'e2'; bestMoveTo = 'e4';
                    renderBoard();
                }
            } catch (e) {
                panel.textContent = '🤖 Стокфиш: Не удалось получить оценку сети';
            }
        }

        // --- ОТМЕНА ХОДА ---
        function undoMove() {
            game.undo();
            if (!isAnalysisMode && !isOnlineGame && game.history().length > 0) {
                game.undo();
            }
            selectedSquare = null;
            bestMoveFrom = null;
            bestMoveTo = null;
            renderBoard();
            updateHistoryDisplay();
            if (isAnalysisMode) requestStockfishCloud();
        }

        function updateHistoryDisplay() {
            let history = game.history();
            document.getElementById('moves-text').textContent = history.length === 0 ? 'нет' : history.join(' ');
        }

        // --- ОНЛАЙН ЛОББИ ---
        async function createOnlineGame() {
            if (!currentUser) return alert('Войдите в аккаунт!');
            let username = currentUser.user_metadata?.username || 'Игрок';
            let { data } = await supabaseClient.from('rooms').insert([{ host: username, fen: game.fen(), status: 'waiting' }]).select().single();
            activeRoomId = data.id;
            playerColor = 'white';
            isOnlineGame = true;
            setupOnlineChannel(activeRoomId);
            startOnlineUI();
        }

        async function loadOnlineRooms() {
            let listEl = document.getElementById('online-games-list');
            let { data } = await supabaseClient.from('rooms').select('*').eq('status', 'waiting');
            if (!data || data.length === 0) { listEl.innerHTML = '<div>Нет свободных игр.</div>'; return; }
            listEl.innerHTML = '';
            data.forEach(r => {
                listEl.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>${r.host}</span><button class="bot-btn" style="width:auto; padding:2px 8px; margin:0;" onclick="joinOnline(${r.id})">Войти</button></div>`;
            });
        }

        async function joinOnline(id) {
            activeRoomId = id;
            playerColor = 'black';
            isOnlineGame = true;
            await supabaseClient.from('rooms').update({ status: 'playing' }).eq('id', id);
            setupOnlineChannel(id);
            startOnlineUI();
        }

        function startOnlineUI() {
            game.reset();
            showSection('game-section');
            document.getElementById('section-title').textContent = 'Онлайн Партия';
            document.getElementById('chessboard').style.display = 'grid';
            document.getElementById('analysis-panel').style.display = 'none'; // Стокфиш скрыт в онлайн-игре
            document.getElementById('moves-history').style.display = 'block';
            document.getElementById('undo-btn').style.display = 'none';
            renderBoard();
        }

        function setupOnlineChannel(id) {
            if (onlineChannel) supabaseClient.removeChannel(onlineChannel);
            onlineChannel = supabaseClient.channel(`room_${id}`)
                .on('broadcast', { event: 'move' }, payload => {
                    game.load(payload.payload.fen);
                    renderBoard();
                    updateHistoryDisplay();
                }).subscribe();
        }

        // --- ОТРИСОВКА ДОСКИ С ПОДСВЕТКОЙ ЛУЧШЕГО ХОДА ---
        function renderBoard() {
            const boardEl = document.getElementById('chessboard');
            boardEl.innerHTML = '';
            let boardData = game.board();

            let rStart = playerColor === 'black' ? 7 : 0;
            let rEnd = playerColor === 'black' ? -1 : 8;
            let rStep = playerColor === 'black' ? -1 : 1;
            let cStart = playerColor === 'black' ? 7 : 0;
            let cEnd = playerColor === 'black' ? -1 : 8;
            let cStep = playerColor === 'black' ? -1 : 1;

            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];

            for (let r = rStart; r !== rEnd; r += rStep) {
                for (let c = cStart; c !== cEnd; c += cStep) {
                    let sqEl = document.createElement('div');
                    let sqName = files[c] + ranks[r];
                    sqEl.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    sqEl.dataset.square = sqName;

                    if (isAnalysisMode) {
                        if (sqName === bestMoveFrom) sqEl.classList.add('best-move-from');
                        if (sqName === bestMoveTo) sqEl.classList.add('best-move-to');
                    }

                    let piece = boardData[r][c];
                    if (piece) {
                        let span = document.createElement('span');
                        span.textContent = pieceSymbols[piece.color === 'w' ? piece.type.toUpperCase() : piece.type.toLowerCase()];
                        span.className = piece.color === 'w' ? 'white-piece' : 'black-piece';
                        sqEl.appendChild(span);
                    }

                    if (selectedSquare === sqName) sqEl.classList.add('selected');
                    sqEl.addEventListener('click', () => onSquareClick(sqName));
                    boardEl.appendChild(sqEl);
                }
            }
        }

        function onSquareClick(square) {
            if (game.game_over()) return;
            let turn = game.turn() === 'w' ? 'white' : 'black';
            if (!isAnalysisMode && turn !== playerColor && !isOnlineGame) return;

            if (!selectedSquare) {
                let piece = game.get(square);
                if (piece && (isAnalysisMode || piece.color === (playerColor === 'white' ? 'w' : 'b'))) {
                    selectedSquare = square;
                    renderBoard();
                }
            } else {
                let move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                selectedSquare = null;
                bestMoveFrom = null;
                bestMoveTo = null;
                renderBoard();
                updateHistoryDisplay();

                if (move) {
                    if (isOnlineGame) {
                        onlineChannel.send({ type: 'broadcast', event: 'move', payload: { fen: game.fen() } });
                    } else if (isAnalysisMode) {
                        requestStockfishCloud();
                    } else if (!game.game_over()) {
                        window.setTimeout(makeBotMove, 150);
                    }
                } else {
                    let piece = game.get(square);
                    if (piece && (isAnalysisMode || piece.color === (playerColor === 'white' ? 'w' : 'b'))) {
                        selectedSquare = square;
                        renderBoard();
                    }
                }
            }
        }

        function makeBotMove() {
            if (game.game_over()) return;
            let moves = game.moves();
            if (moves.length === 0) return;
            let bestMove = moves[Math.floor(Math.random() * moves.length)];
            game.move(bestMove);
            renderBoard();
            updateHistoryDisplay();
        }

        async function loadMessages() {
            let box = document.getElementById('chat-messages');
            let { data } = await supabaseClient.from('messages').select('*');
            box.innerHTML = '';
            data?.forEach(m => box.innerHTML += `<div><b>${m.username || 'Гость'}:</b> ${m.content}</div>`);
            box.scrollTop = box.scrollHeight;
        }

        async function loadPlayers() {
            let box = document.getElementById('players-list');
            let { data } = await supabaseClient.from('messages').select('username');
            box.innerHTML = '';
            [...new Set(data?.map(i => i.username))].forEach(n => box.innerHTML += `<div><b>${n}</b> — 🟢 В сети</div>`);
        }

        async function sendMessage() {
            let input = document.getElementById('chat-input');
            if (!input.value.trim()) return;
            let name = currentUser ? (currentUser.user_metadata?.username || currentUser.email) : 'Гость';
            await supabaseClient.from('messages').insert([{ username: name, content: input.value.trim() }]);
            input.value = '';
            loadMessages();
        }

        window.onload = () => {
            checkUserSession();
            document.getElementById('send-btn')?.addEventListener('click', () => sendMessage());
            document.getElementById('chat-input')?.addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });
        };
    </script>
</body>
</html>
