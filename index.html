<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Шахматный Клуб — Зал, Игроки и Чат</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #333; padding: 30px; border-radius: 8px; width: 380px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 12px; border: none; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .btn-login { background: #4CAF50; color: white; }
        .btn-reg { background: #2196F3; color: white; }
        .btn-logout { background: #f44336; color: white; }
        .btn-back { background: #757575; color: white; }
        #message { text-align: center; font-size: 14px; margin-top: 10px; }
        .section { display: none; }
        .chat-box, .players-box { height: 150px; background: #222; border-radius: 4px; padding: 10px; overflow-y: scroll; margin-bottom: 10px; font-size: 14px; text-align: left; }
        .player-link { color: #64B5F6; cursor: pointer; text-decoration: underline; }
        .player-link:hover { color: #90CAF9; }
    </style>
    <!-- Подключаем библиотеку Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Окно авторизации -->
    <div class="card section" id="auth-form" style="display: block;">
        <h2>Шахматный Клуб</h2>
        <input type="email" id="email" placeholder="Электронная почта">
        <input type="text" id="username" placeholder="Придумайте ник">
        <input type="password" id="password" placeholder="Пароль">
        <button type="button" class="btn-login" onclick="handleLogin()">Войти</button>
        <button type="button" class="btn-reg" onclick="handleRegister()">Регистрация</button>
        <div id="message"></div>
    </div>

    <!-- Главный зал -->
    <div class="card section" id="game-hall">
        <h2>Шахматный Зал</h2>
        <p id="welcome-user" style="text-align: center; margin-bottom: 20px;"></p>
        <button type="button" class="btn-login" onclick="showSection('game-section')">Играть партию</button>
        <button type="button" class="btn-reg" onclick="openChat()">Общий чат</button>
        <button type="button" class="btn-reg" onclick="openPlayers()">Игроки</button>
        <button type="button" class="btn-reg" onclick="openMyProfile()">Профиль</button>
        <button type="button" class="btn-logout" onclick="handleLogout()">Выйти</button>
    </div>

    <!-- Раздел игры -->
    <div class="card section" id="game-section">
        <h2>Игровая Партия</h2>
        <div style="text-align: center; background: #444; padding: 40px; border-radius: 6px; margin-bottom: 15px;">
            ♔ ♕ ♖ ♗ ♘ ♙<br>
            [ Шахматная доска загружена ]<br>
            ♟ ♞ ♝ ♜ ♛ ♚
        </div>
        <button type="button" class="btn-back" onclick="showSection('game-hall')">Назад в зал</button>
    </div>

    <!-- Общий чат -->
    <div class="card section" id="chat-section">
        <h2>Общий Чат</h2>
        <div class="chat-box" id="chat-messages">
            <div><b>Система:</b> Загрузка сообщений...</div>
        </div>
        <input type="text" id="chat-input" placeholder="Введите сообщение...">
        <button type="button" class="btn-login" id="send-btn">Отправить</button>
        <button type="button" class="btn-back" onclick="showSection('game-hall')">Назад в зал</button>
    </div>

    <!-- Список игроков -->
    <div class="card section" id="players-section">
        <h2>Игроки клуба</h2>
        <div class="players-box" id="players-list">
            <div><b>Система:</b> Загрузка списка...</div>
        </div>
        <button type="button" class="btn-back" onclick="showSection('game-hall')">Назад в зал</button>
    </div>

    <!-- Профиль -->
    <div class="card section" id="profile-section">
        <h2>Профиль игрока</h2>
        <p id="profile-info"></p>
        <button type="button" class="btn-back" onclick="showSection('game-hall')">Назад в зал</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://kxetnpcgftrcnyppwqlt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4ZXRucGNnZnRyY255cHB3cWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mjc4NzIsImV4cCI6MjEwMzIwMzg3Mn0.sCn_jUrDLWpyz4qRlkr6EKklvrx1UKdCJUkutWcZ8Po';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function handleRegister() {
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            if (!email || !username || !password) {
                msg.style.color = '#ff6b6b';
                msg.textContent = 'Заполните все поля!';
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: { data: { username: username } }
            });

            if (error) {
                msg.style.color = '#ff6b6b';
                msg.textContent = 'Ошибка: ' + error.message;
            } else {
                const { error: loginError } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (!loginError) {
                    checkUserSession();
                } else {
                    msg.style.color = '#4CAF50';
                    msg.textContent = 'Аккаунт создан! Теперь нажмите «Войти».';
                }
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            const { error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                msg.style.color = '#ff6b6b';
                msg.textContent = 'Неверный логин или пароль!';
            } else {
                checkUserSession();
            }
        }

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                showSection('game-hall');
                const username = currentUser.user_metadata?.username || currentUser.email;
                document.getElementById('welcome-user').textContent = 'Игрок: ' + username;
            }
        }

        function openMyProfile() {
            if (currentUser) {
                const username = currentUser.user_metadata?.username || currentUser.email;
                showUserProfile(username, currentUser.email);
            }
        }

        function showUserProfile(username, emailInfo = 'Скрыт') {
            showSection('profile-section');
            let role = 'Обычный игрок';
            if (username.toLowerCase() === 'шахматный клуб') {
                role = 'Создатель сайта ⚙️';
            }

            document.getElementById('profile-info').innerHTML = `
                <b>Ник:</b> ${username}<br>
                <b>Email:</b> ${emailInfo}<br>
                <b>Звание:</b> ${role}<br>
                <b>Статус:</b> В сети
            `;
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.style.display = 'none');
            document.getElementById(sectionId).style.display = 'block';
        }

        function openChat() {
            showSection('chat-section');
            loadMessages();
        }

        function openPlayers() {
            showSection('players-section');
            loadPlayers();
        }

        async function loadMessages() {
            const box = document.getElementById('chat-messages');
            box.innerHTML = '<div><b>Система:</b> Загрузка...</div>';

            const { data, error } = await supabaseClient
                .from('messages')
                .select('*');

            if (error) {
                box.innerHTML = '<div style="color: #ff6b6b;"><b>Ошибка загрузки чата</b></div>';
                return;
            }

            box.innerHTML = '';
            if (!data || data.length === 0) {
                box.innerHTML = '<div><b>Система:</b> Пока нет сообщений. Будьте первыми!</div>';
            } else {
                data.forEach(msg => {
                    const author = msg.username || 'Гость';
                    box.innerHTML += `<div style="margin-bottom: 4px;">
                        <span class="player-link" onclick="showUserProfile('${author}')"><b>${author}</b></span>: ${msg.content}
                    </div>`;
                });
            }
            box.scrollTop = box.scrollHeight;
        }

        async function loadPlayers() {
            const box = document.getElementById('players-list');
            box.innerHTML = '<div><b>Система:</b> Загрузка списка...</div>';

            const { data, error } = await supabaseClient
                .from('messages')
                .select('username');

            if (error) {
                box.innerHTML = '<div style="color: #ff6b6b;"><b>Ошибка загрузки</b></div>';
                return;
            }

            box.innerHTML = '';
            if (!data || data.length === 0) {
                box.innerHTML = '<div><b>Система:</b> Список пуст.</div>';
            } else {
                const names = [...new Set(data.map(i => i.username))];
                names.forEach(name => {
                    const playerName = name || 'Гость';
                    let roleBadge = '<span style="color: #aaa; font-size: 12px;">(Обычный игрок)</span>';
                    if (playerName.toLowerCase() === 'шахматный клуб') {
                        roleBadge = '<span style="color: #FFD700; font-size: 12px;">(Создатель сайта ⚙️)</span>';
                    }

                    box.innerHTML += `<div style="margin-bottom: 6px;">
                        <span class="player-link" onclick="showUserProfile('${playerName}')"><b>${playerName}</b></span> 
                        ${roleBadge} — <span style="color: #4CAF50;">🟢 В сети</span>
                    </div>`;
                });
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            let username = 'Гость';
            if (currentUser) {
                username = currentUser.user_metadata?.username || currentUser.email;
            }

            const { error } = await supabaseClient
                .from('messages')
                .insert([
                    { username: username, content: text }
                ]);

            if (error) {
                alert('Ошибка отправки: ' + error.message);
            } else {
                input.value = '';
                loadMessages();
            }
        }

        window.onload = () => {
            checkUserSession();

            const sendBtn = document.getElementById('send-btn');
            if (sendBtn) {
                sendBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    sendMessage();
                });
                sendBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    sendMessage();
                });
            }

            const chatInput = document.getElementById('chat-input');
            if (chatInput) {
                chatInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        sendMessage();
                    }
                });
            }
        };
    </script>
</body>
</html>
