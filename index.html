<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Шахматный Клуб — Зал, Игроки и Чат</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card, .hall-card { background: #333; padding: 30px; border-radius: 8px; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 12px; border: none; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .btn-login { background: #4CAF50; color: white; }
        .btn-reg { background: #2196F3; color: white; }
        .btn-logout { background: #f44336; color: white; }
        #message { text-align: center; font-size: 14px; margin-top: 10px; }
        .hall-section { display: none; }
    </style>
    <!-- Подключаем библиотеку Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Окно авторизации -->
    <div class="auth-card" id="auth-form">
        <h2>Шахматный Клуб</h2>
        <input type="email" id="email" placeholder="Электронная почта">
        <input type="text" id="username" placeholder="Придумайте ник">
        <input type="password" id="password" placeholder="Пароль">
        <button class="btn-login" onclick="handleLogin()">Войти</button>
        <button class="btn-reg" onclick="handleRegister()">Регистрация</button>
        <div id="message"></div>
    </div>

    <!-- Главный зал со всеми функциями -->
    <div class="hall-card hall-section" id="game-hall">
        <h2>Шахматный Зал</h2>
        <p id="welcome-user" style="text-align: center; margin-bottom: 20px;"></p>
        
        <button class="btn-login" onclick="startChessGame()">Играть партию</button>
        <button class="btn-reg" onclick="openChat()">Общий чат</button>
        <button class="btn-reg" onclick="openProfile()">Профиль</button>
        <button class="btn-logout" onclick="handleLogout()">Выйти</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://kxetnpcgftrcnyppwqlt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // Укажите ваш ключ проекта, если нужно
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleRegister() {
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            if (!email || !username || !password) {
                msg.style.color = '#ff6b6b';
                msg.textContent = 'Заполните все поля!';
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: { username: username },
                    emailRedirectTo: window.location.href
                }
            });

            if (error) {
                msg.style.color = '#ff6b6b';
                msg.textContent = 'Ошибка: ' + error.message;
            } else {
                msg.style.color = '#4CAF50';
                msg.textContent = 'Ссылка для подтверждения отправлена на почту!';
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                msg.style.color = '#ff6b6b';
                msg.textContent = 'Неверный логин или пароль!';
            } else {
                checkUserSession();
            }
        }

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('auth-form').style.display = 'none';
                document.getElementById('game-hall').style.display = 'block';
                document.getElementById('welcome-user').textContent = 'Игрок: ' + session.user.email;
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        function startChessGame() {
            alert('Запуск шахматной доски и игры...');
        }

        function openChat() {
            alert('Открытие общего чата...');
        }

        function openProfile() {
            alert('Ваш профиль и статистика...');
        }

        window.onload = () => {
            checkUserSession();
        };
    </script>
</body>
</html>
